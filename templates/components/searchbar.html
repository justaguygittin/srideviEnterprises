<!--
=========================================================
Project : Sridevi Enterprises
File    : searchbar.html

Purpose:
Reusable search bar component. Submits to the existing
Products search (GET /products?search=...), reusing the
same "search" query parameter and visual language as the
Products page search bar (.search-bar / products.css).
=========================================================
-->
<form class="search-bar navbar-search-bar" role="search" method="GET" action="{{ url_for('customer.products') }}">

    <div class="search-bar-field">

        <i class="fa-solid fa-magnifying-glass search-bar-icon" aria-hidden="true"></i>

        <label for="navbar-search" class="visually-hidden">Search products</label>

        <input id="navbar-search" class="form-control search-bar-input" type="search" name="search"
            placeholder="Search products..." autocomplete="off">

    </div>

    <button class="btn btn-primary search-bar-submit" type="submit">

        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <span class="visually-hidden">Search</span>

    </button>

</form>
